 const files=v("files").split("\n").map(v=>v.trim()).filter(Boolean);
 if(ctx.type==="state"){
   const n=getState(ctx.id);n.title=v("title");n.note=v("note");if(n.status==="running"||n.status==="planned")n.expectedFiles=files;else n.files=files;n.updatedAt=stamp;n.writtenBy="Human";n.origin="manual";
 }else if(ctx.type==="add"){
   const parent=getState(ctx.parent),r=$("#viewport").getBoundingClientRect(),pos=freePosition(parent?parent.x+290:(r.width/2-camera.x)/camera.scale,parent?parent.y+190:(r.height/2-camera.y)/camera.scale),id=newId("S");
   flow.states.push(state(id,v("title"),pos.x,pos.y,files,v("note"),null,{writtenBy:"Human",origin:"manual",updatedAt:stamp,codeRef:parent?.codeRef||null}));
   if(parent)flow.actions.push(action(newId("a"),parent.id,id,v("label"),v("command"),v("reason"),{writtenBy:"Human",methodSource:"Manually supplied action. No execution is recorded.",updatedAt:stamp}));
   selected=id;
 }else if(ctx.type==="action"){
   const a=getAction(ctx.id);a.label=v("label");a.command=v("command");a.reason=v("reason");a.writtenBy="Human";a.updatedAt=stamp;delete a.option;a.methodSource="Manually edited action. No execution is recorded.";
 }else if(ctx.type==="connect"){
   flow.actions.push(action(newId("a"),ctx.from,ctx.to,v("label"),v("command"),v("reason"),{writtenBy:"Human",methodSource:"Manually supplied connection. No execution is recorded.",updatedAt:stamp}));
 }
 $("#editor").close();changed(ctx.type==="state"?"Edited state "+ctx.id:ctx.type==="action"?"Edited action "+ctx.id:ctx.type==="add"?"Added state "+selected:"Connected "+ctx.from+" to "+ctx.to);toast("Saved in this browser.");
};
$("#delete-item").onclick=()=>{
 const ctx=editorContext;checkpoint();
 if(ctx.type==="state"){flow.states=flow.states.filter(n=>n.id!==ctx.id);flow.actions=flow.actions.filter(a=>a.to!==ctx.id&&!a.from.includes(ctx.id));if(selected===ctx.id)selected=null;}
 else if(ctx.type==="action")flow.actions=flow.actions.filter(a=>a.id!==ctx.id);
 $("#editor").close();changed("Deleted "+ctx.type+" "+ctx.id);if(ctx.type==="state"&&!$("#detail-view").hidden)location.hash="";toast("Removed. Undo is available in Edit flow.");
};
$("#close-editor").onclick=$("#cancel-editor").onclick=()=>$("#editor").close();
$("#editor").addEventListener("click",e=>{if(e.target===$("#editor")){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
$("#edit-toggle").onclick=()=>setEditing(!editing);
$("#undo").onclick=()=>{if(!history.length)return;flow=history.pop();selected=null;connecting=null;$("#viewport").classList.remove("connecting");save();render();toast("Change undone.");};
$("#add-state").onclick=()=>addState();
$("#selection-tools").onclick=e=>{const mode=e.target.closest("[data-edit-action]")?.dataset.editAction,n=getState(selected);if(!n)return;if(mode==="open")openState(n.id);if(mode==="edit")openStateEditor(n);if(mode==="branch")addState(n);if(mode==="connect")startConnecting(n.id);};
$("#fit").onclick=()=>{hidePopups();fit();};
$("#zoom-in").onclick=()=>zoom(1.2);$("#zoom-out").onclick=()=>zoom(1/1.2);
$("#viewport").addEventListener("wheel",e=>{e.preventDefault();const r=e.currentTarget.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
$("#nodes").addEventListener("pointerover",e=>{const n=e.target.closest("[data-state]");if(!n||n.contains(e.relatedTarget))return;clearTimeout(hideTimer);clearTimeout(hoverTimer);hoverTimer=setTimeout(()=>showPreview(n.dataset.state,n),220);});
$("#nodes").addEventListener("pointerout",e=>{const n=e.target.closest("[data-state]");if(!n||n.contains(e.relatedTarget))return;clearTimeout(hoverTimer);hideTimer=setTimeout(()=>$("#preview").hidden=true,150);});
$("#preview").onpointerenter=()=>clearTimeout(hideTimer);
$("#preview").onpointerleave=()=>{hideTimer=setTimeout(()=>$("#preview").hidden=true,150);};
$("#preview").onclick=e=>{const b=e.target.closest("[data-open]");if(b)openState(b.dataset.open);};
let suppressClick=false;
$("#viewport").addEventListener("pointerdown",e=>{
 if(e.button!==0)return;
 const card=e.target.closest("[data-state]");
 if(e.target.closest(".port")){e.preventDefault();startConnecting(card.dataset.state);return;}
 if(e.target.closest(".edge-group"))return;
 if(connecting&&card)return;
 if(card&&!editing)return;
 hidePopups();e.preventDefault();$("#viewport").setPointerCapture(e.pointerId);
 drag={id:card?.dataset.state||null,startX:e.clientX,startY:e.clientY,x:card?getState(card.dataset.state).x:camera.x,y:card?getState(card.dataset.state).y:camera.y,moved:false,before:card?copy(flow):null};
 if(!card){$("#viewport").classList.add("panning");selected=null;positionSelection();}
});
$("#viewport").addEventListener("pointermove",e=>{
 if(!drag)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;
 if(!drag.moved)return;
 if(drag.id){const n=getState(drag.id);n.x=Math.round(drag.x+dx/camera.scale);n.y=Math.round(drag.y+dy/camera.scale);const el=$("#nodes").querySelector('[data-state="'+CSS.escape(drag.id)+'"]');el.style.left=n.x+"px";el.style.top=n.y+"px";renderEdges();positionSelection();}
 else{camera.x=drag.x+dx;camera.y=drag.y+dy;applyCamera();}
});
function endDrag(e){
 if(!drag)return;const d=drag;drag=null;$("#viewport").classList.remove("panning");if($("#viewport").hasPointerCapture(e.pointerId))$("#viewport").releasePointerCapture(e.pointerId);
 if(d.moved){suppressClick=true;setTimeout(()=>suppressClick=false,50);if(d.id){history.push(d.before);if(history.length>30)history.shift();selected=d.id;changed("Moved state "+d.id+" on the canvas");}}
 else if(d.id){selected=d.id;render();}
}
$("#viewport").addEventListener("pointerup",endDrag);
$("#viewport").addEventListener("pointercancel",endDrag);
$("#nodes").addEventListener("click",e=>{
 if(suppressClick||e.target.closest(".port"))return;const n=e.target.closest("[data-state]");if(!n)return;
 if(connecting){connectTo(n.dataset.state);return;}
 if(editing){selected=n.dataset.state;render();}else openState(n.dataset.state);
});
$("#edges").addEventListener("click",e=>{const g=e.target.closest("[data-action]");if(g)showAction(g.dataset.action,g);});
$("#edges").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const g=e.target.closest("[data-action]");if(g){e.preventDefault();showAction(g.dataset.action,g);}}});
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#action-preview")&&!e.target.closest(".edge-group"))$("#action-preview").hidden=true;});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){hidePopups();if(connecting){connecting=null;$("#viewport").classList.remove("connecting");$("#canvas-hint").textContent="Drag states · Select a state to edit or add a branch";}else selected=null;positionSelection();}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"&&editing&&!e.target.closest("input,textarea")&&!$("#editor").open){e.preventDefault();$("#undo").click();}
});
window.addEventListener("hashchange",route);
window.addEventListener("resize",()=>{hidePopups();applyCamera();});
render();fit(true);route();
window.SaigenMock={getSnapshot:()=>copy(flow),getCamera:()=>({...camera}),validate:()=>validFlow(flow)};
</script>
</body>
</html>
