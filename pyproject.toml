[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saigenbio"
version = "0.2.0"
description = "Local biological analysis records and a visual flow viewer"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
saigen = "saigen.__main__:main"

[tool.setuptools]
packages = ["saigen", "saigen.workflows", "saigen.workflows.adapters"]

[tool.setuptools.package-data]
saigen = ["shell/*.zsh"]

[tool.setuptools.data-files]
"share/saigenbio/ui" = ["ui/index.html", "ui/app.js", "ui/explanation-editor.js", "ui/detail-controller.js", "ui/geometry.js", "ui/paths.js", "ui/api.js", "ui/reports.js", "ui/workflows.js", "ui/details.js", "ui/story.js", "ui/reconstruction.js", "ui/verification.js", "ui/style.css"]
"share/saigenbio/ui/assets" = ["ui/assets/logo.svg", "ui/assets/logo-512.png", "ui/assets/logo-1024.png", "ui/assets/favicon.svg", "ui/assets/favicon-16.png", "ui/assets/favicon-32.png", "ui/assets/favicon-48.png", "ui/assets/favicon.ico"]
"share/saigenbio/skills/saigen-record" = ["skills/saigen-record/SKILL.md"]

"share/saigenbio/skills/saigen-record/references" = ["skills/saigen-record/references/reconstruction.md", "skills/saigen-record/references/story.md", "skills/saigen-record/references/verification.md"]
